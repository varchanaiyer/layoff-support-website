name: Refresh job listings
on:
  schedule:
    - cron: '15 5 * * *'   # every day, 05:15 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch jobs from Himalayas
        run: python3 tools/fetch_jobs.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/live-jobs.json; then echo "No changes"; exit 0; fi
          git config user.name "layoff-support-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live-jobs.json
          git commit -m "Refresh job listings"
          git push
